# AI for DevOps lab. Follow README.md, in this order:
#   1. kind create cluster --name ai-lab      (creates the "kind" network the agent needs)
#   2. docker compose up -d                   (Ollama, Postgres with pgvector, Phoenix)
#   3. docker compose run --rm rag ...        (stages 2, 3 and 6)
#   4. docker compose run --rm agent ...      (stages 4 and 5)
services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama   # so "docker exec ollama ..." in the article works
    ports: ["11434:11434"]
    volumes: [ollama:/root/.ollama]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      retries: 12
    # NVIDIA GPU? Uncomment:
    # deploy:
    #   resources:
    #     reservations:
    #       devices: [{driver: nvidia, count: all, capabilities: [gpu]}]

  # One-shot job: pulls the models, then exits. Re-runs are fast (models are cached in the volume).
  ollama-init:
    image: ollama/ollama:latest
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["sh", "-c", "ollama pull llama3.1 && ollama pull llama3.2 && ollama pull nomic-embed-text"]
    depends_on:
      ollama: {condition: service_healthy}
    restart: "no"

  db:
    image: pgvector/pgvector:0.8.0-pg17
    environment:
      POSTGRES_PASSWORD: postgres
    ports: ["5432:5432"]
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro  # creates the extension and table
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 12

  phoenix:
    image: arizephoenix/phoenix:latest
    ports: ["6006:6006"]  # UI and OTLP/HTTP trace ingestion (/v1/traces)

  # Stages 3 and 6: RAG and evals. No Kubernetes credentials, no cluster network.
  rag:
    build: ./agent
    profiles: ["tools"]
    environment:
      OLLAMA_HOST: http://ollama:11434
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
    volumes:
      - ./runbooks:/app/runbooks:ro
      - ./evals:/app/evals:ro
    command: ["python", "rag.py", "ingest", "runbooks"]
    depends_on:
      ollama-init: {condition: service_completed_successfully}
      db: {condition: service_healthy}

  # Stages 4 and 5: the agent. Needs the kind cluster and kube/agent-kubeconfig (see README Step 1).
  agent:
    build: ./agent
    profiles: ["tools"]   # not started by "up"; used with "docker compose run"
    environment:
      OLLAMA_HOST: http://ollama:11434
      MODEL_ID: llama3.1
      DATABASE_URL: postgresql://postgres:postgres@db:5432/postgres
      OTEL_EXPORTER_OTLP_ENDPOINT: http://phoenix:6006  # exporter appends /v1/traces
      KUBECONFIG: /kube/config
      ALLOWED_NAMESPACES: payments
    volumes:
      - ./kube/agent-kubeconfig:/kube/config:ro  # read-only service account, NOT your admin kubeconfig
      - ./runbooks:/app/runbooks:ro
      - ./evals:/app/evals:ro
    networks: [default, kind]
    depends_on:
      ollama-init: {condition: service_completed_successfully}
      db: {condition: service_healthy}
      phoenix: {condition: service_started}

networks:
  kind:
    external: true   # created by kind; lets the agent reach the cluster API server

volumes:
  ollama:
  pgdata:
